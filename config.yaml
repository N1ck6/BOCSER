mol_file_name : "tests/NonBR1/NonBR.mol"
exp_name: "NonBR"
spin_multiplicity : 1
charge : 0
orca_exec_command: "/opt/orca_6.1.0/orca"
num_of_procs : 8
orca_method: "M062X 6-31+G(d)"
orca_poll_timeout_minutes: 560
broken_struct_energy : 100.0
ts: true
load_ensemble: "NonBR_New-4wE.xyz"
rolling_window_size : 5
rolling_std_threshold : 0
rolling_mean_threshold : 0
max_steps : 20
acquisition_function : "ik"
ts_max_iter: 50
clear_working_folder: False
fixed_double_bonds:
  - [3, 24]
  - [9, 23]
  - [12, 15]
  - [16, 17]
  - [10, 11]
ts_bonds:
  - [13, 14]
  - [18, 19]
extra_constraints:
  - type: bond
    atoms: [13, 14]
    value: current
  - type: bond
    atoms: [18, 19]
    value: current
vary_ts_bond_lengths : False
bond_stretch_factor : 1.6